# Bump native SDK version numbers whenever a repository dispatch of a new
# release is received.
name: Bump Native SDKs
on:
  repository_dispatch:
    types: ['ios-sdk-release', 'android-sdk-release']

jobs:
  update_android_sdk_version:
    runs-on: ubuntu-latest
    if: github.event.client_payload.platform == 'android'
    steps:
      - uses: actions/checkout@v4

      - name: Bump io.radar:sdk to ${{ github.event.client_payload.release }}
        env:
          VERSION: ${{ github.event.client_payload.release }}
        run: |
          sed -i -E "s|(io\.radar:sdk:)[0-9]+\.[0-9]+\.[0-9]+|\1${VERSION}|g" \
            android/build.gradle \
            example/android/app/build.gradle

      - name: Verify the bump applied
        run: |
          if git diff --quiet; then
            echo "::error::No files changed. The version pattern did not match - check the sed expressions against the current build files."
            exit 1
          fi
          git diff

      - uses: peter-evans/create-pull-request@v7
        with:
          title: Automated radar-sdk-android version bump to ${{ github.event.client_payload.release }}
          reviewers: radarlabs/eng
          token: ${{ secrets.GITHUB_TOKEN }}

  update_ios_sdk_version:
    runs-on: ubuntu-latest
    if: github.event.client_payload.platform == 'ios'
    steps:
      - uses: actions/checkout@v4

      - name: Bump RadarSDK to ${{ github.event.client_payload.release }}
        env:
          VERSION: ${{ github.event.client_payload.release }}
        run: |
          sed -i -E "s|(s\.dependency 'RadarSDK', ')[0-9]+\.[0-9]+\.[0-9]+(')|\1${VERSION}\2|" ios/flutter_radar.podspec
          sed -i -E "s|(s\.dependency 'RadarSDKMotion', ')[0-9]+\.[0-9]+\.[0-9]+(')|\1${VERSION}\2|" ios/flutter_radar.podspec

      - name: Verify the bump applied
        run: |
          if git diff --quiet; then
            echo "::error::No files changed. The version pattern did not match - check the sed expressions against the current podspec."
            exit 1
          fi
          git diff

      - uses: peter-evans/create-pull-request@v7
        with:
          title: Automated radar-sdk-ios version bump to ${{ github.event.client_payload.release }}
          reviewers: radarlabs/eng
          token: ${{ secrets.GITHUB_TOKEN }}