name: Flutter build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build (${{ matrix.flutter_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flutter_name: minimum
            flutter_version: '3.29.0'
          - flutter_name: latest
            flutter_version: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter_version }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Must run before the Android build, which rewrites gradle.properties via
      # Flutter's Gradle migration and would fail pub's clean-git-state check.
      - run: dart pub publish --dry-run
      - run: flutter test
      - name: Install example dependencies
        working-directory: example
        run: flutter pub get
      - name: Install Android NDK
        run: |
          for attempt in 1 2 3; do
            if sdkmanager "ndk;27.0.12077973"; then
              exit 0
            fi
            rm -rf "$ANDROID_HOME/ndk/27.0.12077973"
            sleep $((attempt * 5))
          done
          exit 1
      - name: Run Android unit tests
        working-directory: example/android
        run: ./gradlew :flutter_radar:testDebugUnitTest
      - name: Build example app
        working-directory: example
        run: flutter build apk --debug
