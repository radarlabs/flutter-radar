name: Flutter build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build (${{ matrix.flutter_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flutter_name: minimum
            flutter_version: '3.29.0'
          # Pinned to the last stable release before 3.50. Flutter 3.50 requires
          # Gradle 9.3.1, AGP 9.1.1, and Kotlin 2.4.10 (the example is on 8.14,
          # 8.11.1, and 2.2.20) and deprecates package:flutter/material.dart,
          # which flutter analyze reports. Unpin after the AGP 9 upgrade.
          - flutter_name: latest
            flutter_version: '3.47.9'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter_version }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Formatter output can differ between Dart versions, so check formatting
      # on the pinned latest version only.
      - name: Check formatting
        if: matrix.flutter_name == 'latest'
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/integration_test
      # Must run before the Android build, which rewrites gradle.properties via
      # Flutter's Gradle migration and would fail pub's clean-git-state check.
      - run: dart pub publish --dry-run
      - run: flutter test
      - name: Test native SDK sync script
        run: node --test scripts/tests/native-sdk-sync.test.mjs
      - name: Install example dependencies
        working-directory: example
        run: flutter pub get
      - name: Run Android unit tests
        working-directory: example/android
        run: ./gradlew :flutter_radar:testDebugUnitTest
      - name: Build example app
        working-directory: example
        run: flutter build apk --debug
